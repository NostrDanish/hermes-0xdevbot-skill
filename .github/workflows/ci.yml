name: skill-checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python -m py_compile skills/*/scripts/*.py
      - run: python tests/validate_skill.py
      - run: python -m unittest discover -s tests -v
      - name: triage fails closed without a key
        run: |
          out=$(env -u TYPESAFE_API_KEY python skills/0xdevbot-persona/scripts/jev_triage.py "what is a relay?")
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '"decision": "escalate"'
